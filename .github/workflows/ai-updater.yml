name: AI Config Auto Updater

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  update-configs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for version updates
        id: check
        run: node .github/scripts/check-versions.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update configs with Cerebras AI
        if: steps.check.outputs.has_updates == 'true'
        id: update
        run: node .github/scripts/ai-updater.js
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CHANGES: ${{ steps.check.outputs.changes }}

      - name: Validate updated configs
        if: steps.check.outputs.has_updates == 'true'
        id: validate
        run: node .github/scripts/validator.js

      - name: Generate changelog entry
        if: steps.check.outputs.has_updates == 'true' && steps.validate.outputs.passed == 'true'
        run: node .github/scripts/changelog-generator.js
        env:
          CHANGES: ${{ steps.check.outputs.changes }}

      - name: Commit and push updates
        if: steps.check.outputs.has_updates == 'true' && steps.validate.outputs.passed == 'true'
        run: |
          git config user.name "AI Updater Bot"
          git config user.email "bot@users.noreply.github.com"
          git add configs/ meta/versions.json CHANGELOG.md
          git diff --staged --quiet || git commit -m "chore(auto): update MCP package versions $(date +'%Y-%m-%d')"
          git push

      - name: Open issue on failure
        if: always() && steps.check.outputs.has_updates == 'true' && steps.validate.outputs.passed == 'false'
        uses: actions/github-script@v7
        env:
          ERROR_DETAILS: ${{ steps.validate.outputs.ERROR_DETAILS }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const details = process.env.ERROR_DETAILS || 'No validator error details were provided.';
            const body = [
              'The automated config update workflow failed during validation.',
              '',
              'Error details:',
              '```',
              details,
              '```',
              '',
              'Please review the latest Actions run logs for more information.'
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Auto-update validation failed — ${today}`,
              body,
              labels: ['bug', 'auto-update'],
            });
