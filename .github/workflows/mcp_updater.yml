name: MCP Config Auto Updater

on:
  schedule:
    # Weekdays only (Mon-Fri). No weekend runs.
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

jobs:
  update_configs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for version updates
        id: check
        run: node .github/scripts/check_versions.js

      - name: Apply deterministic version pins
        if: steps.check.outputs.has_updates == 'true'
        id: update
        run: node .github/scripts/update_versions.js
        env:
          CHANGES: ${{ steps.check.outputs.changes }}

      - name: Validate updated configs
        if: steps.check.outputs.has_updates == 'true'
        id: validate
        run: node .github/scripts/validator.js

      - name: Generate changelog entry
        if: steps.check.outputs.has_updates == 'true' && steps.validate.outputs.passed == 'true'
        run: node .github/scripts/changelog_generator.js
        env:
          CHANGES: ${{ steps.check.outputs.changes }}

      - name: Commit and push updates
        if: steps.check.outputs.has_updates == 'true' && steps.validate.outputs.passed == 'true'
        run: |
          git config user.name "MOHAbdelkarim"
          git config user.email "mohaabdelkarim2@gmail.com"
          git add configs/ meta/versions.json CHANGELOG.md
          git diff --staged --quiet || git commit -m "chore(auto): update MCP package versions $(date +'%Y-%m-%d')"
          git push

      - name: Open issue on failure
        if: always() && steps.check.outputs.has_updates == 'true' && steps.validate.outputs.passed == 'false'
        uses: actions/github-script@v7
        env:
          ERROR_DETAILS: ${{ steps.validate.outputs.ERROR_DETAILS }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const details = process.env.ERROR_DETAILS || 'No validator error details were provided.';
            const body = [
              'The automated config update workflow failed during validation.',
              '',
              'Error details:',
              '```',
              details,
              '```',
              '',
              'Please review the latest Actions run logs for more information.'
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Auto-update validation failed (${today})`,
              body,
              labels: ['bug', 'auto-update'],
            });

      - name: Slack digest on MCP update
        if: success() && steps.check.outputs.has_updates == 'true' && steps.validate.outputs.passed == 'true'
        env:
          SLACK_WEBHOOK_DEVTOOLS: ${{ secrets.SLACK_WEBHOOK_DEVTOOLS }}
          CHANGES: ${{ steps.check.outputs.changes }}
        run: |
          if [ -z "$SLACK_WEBHOOK_DEVTOOLS" ]; then exit 0; fi
          python scripts/slack_notify.py --digest \
            --title "stackmind MCP updater" \
            --text "${CHANGES}" \
            --webhook-env SLACK_WEBHOOK_DEVTOOLS

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_ALERTS }}
          webhook-type: incoming-webhook
          payload: |
            text: "CI failed: ${{ github.repository }} / ${{ github.workflow }}"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*${{ github.repository }}* — `${{ github.workflow }}` failed\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
