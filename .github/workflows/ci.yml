name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci_${{ github.workflow }}_${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate configs and kits
        run: npm run validate

      - name: Doctor
        run: npm run doctor

      - name: CLI smoke
        run: npm run cli_smoke

      - name: Eval harness
        run: npm run eval

      - name: Demo proof
        run: npm run demo_proof

      - name: Live smoke
        run: npm run live_smoke

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_ALERTS }}
          webhook-type: incoming-webhook
          payload: |
            text: "CI failed: ${{ github.repository }} / ${{ github.workflow }}"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*${{ github.repository }}* — `${{ github.workflow }}` failed\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
